name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  # Its own job, so downloading a browser never slows `validate` down, and the
  # two report independently.
  e2e:
    runs-on: ubuntu-latest
    # A backstop on the whole job (install, browser download, suite). The suite's
    # own budget is on its step, so that a suite that overruns still reaches the
    # upload step below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      # The suite is ~1 minute on two workers. `retries: 2` means a suite that is
      # broken rather than failing spends 30 s per attempt per spec, so it can run
      # for hours (a wrong dev-server base once made every embed spec time out and
      # the job ran 20+ minutes before it was killed). A step timeout fails the
      # step, not the job, so the report below still uploads.
      - run: yarn test:e2e
        timeout-minutes: 10

      # A failure is otherwise a stack trace with no page: the HTML report has
      # the run, and `test-results/` the trace Playwright records on the first
      # retry.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
